# Временная проверка: сборка и запуск окна на настоящей Windows
name: Windows UI check
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  windows-ui:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build Lab_MVVM.sln -c Release
      - name: UI Automation smoke test
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .github\ui-check\ui-smoke.ps1
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
